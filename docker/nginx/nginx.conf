events {
    worker_connections 4096;
}

http {
    # ------------------------------------------------------------------
    # 上游：三個 API Instance
    # ------------------------------------------------------------------
    upstream flashsale_api {
        # least_conn：把新請求送給「目前連線數最少」的那一台。
        #
        # 不用預設的 round-robin，是因為搶購請求的耗時差異很大
        # （命中快取 ~1ms，真的成交要跑資料庫 ~15ms）。
        # round-robin 只看次數不看負載，容易把請求排到還在忙的機器後面。
        least_conn;

        # max_fails / fail_timeout：連續失敗就暫時把該台移出輪替。
        # 這是 Kill Instance 測試能夠「自動繞過死掉的機器」的關鍵 ——
        # 沒有它，Nginx 會一直把 1/3 的流量送給已經不存在的容器。
        server api-1:8080 max_fails=2 fail_timeout=5s;
        server api-2:8080 max_fails=2 fail_timeout=5s;
        server api-3:8080 max_fails=2 fail_timeout=5s;

        keepalive 64;
    }

    # 壓測時的預設值太小會讓 Nginx 自己變成瓶頸，
    # 量到的就不是後端的容量而是代理的容量。
    keepalive_timeout 65;

    server {
        listen 80;

        location / {
            proxy_pass http://flashsale_api;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host              $host;

            # 沒有這兩行，API 端看到的 RemoteIpAddress 會是 Nginx 的 IP，
            # per-IP 限流會把所有人算成同一個分區 —— 一個人超量就擋住全站。
            # API 端需搭配 UseForwardedHeaders() 才會生效。
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 某一台掛掉或回 5xx 時，自動改送下一台。
            # 只對 GET 這類冪等請求安全 —— POST 重送可能造成重複執行，
            # 因此刻意不加 non_idempotent。
            # 搶購的重送保護由 Stage 6 的 Idempotency-Key 負責。
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            proxy_connect_timeout 2s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # Nginx 自身的存活檢查，不會轉發到後端。
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
